name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TEST_BETTER_AUTH_SECRET: ci-test-better-auth-secret
  CI_TEST_POLAR_ACCESS_TOKEN: ci-test-polar-access-token
  CI_TEST_POLAR_WEBHOOK_SECRET: ci-test-polar-webhook-secret
  CI_TEST_POLAR_PRO_PRODUCT_ID: ci-test-polar-pro-product-id

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Lint and format check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: toggles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test self-host container
        run: |
          set -euo pipefail
          docker run -d --name toggles-ci-smoke \
            -p 127.0.0.1:3000:3000 \
            -e BETTER_AUTH_SECRET="${{ env.CI_TEST_BETTER_AUTH_SECRET }}" \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000/api/auth \
            -e DATABASE_URL=/tmp/toggles-ci.db \
            -e POLAR_ACCESS_TOKEN="${{ env.CI_TEST_POLAR_ACCESS_TOKEN }}" \
            -e POLAR_WEBHOOK_SECRET="${{ env.CI_TEST_POLAR_WEBHOOK_SECRET }}" \
            -e POLAR_PRO_PRODUCT_ID="${{ env.CI_TEST_POLAR_PRO_PRODUCT_ID }}" \
            -e LOCAL=true \
            -e PRODUCT_BETA=false \
            toggles:ci

          cleanup() {
            docker logs toggles-ci-smoke 2>&1 || true
            docker rm -f toggles-ci-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: /ping did not respond in time"
          exit 1
