name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_TEST_BETTER_AUTH_SECRET: ci-test-better-auth-secret
  CI_TEST_POLAR_ACCESS_TOKEN: ci-test-polar-access-token
  CI_TEST_POLAR_WEBHOOK_SECRET: ci-test-polar-webhook-secret
  CI_TEST_POLAR_PRO_PRODUCT_ID: ci-test-polar-pro-product-id

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Lint and format check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test:ci

      - name: Coverage job summary
        run: >-
          node scripts/write-coverage-summary.mjs
          --title "Vitest (Cloudflare Workers pool)"

      - name: Upload coverage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-workers
          path: packages/app/coverage/coverage-summary.json
          if-no-files-found: error

      - name: Build
        run: pnpm run build

  node-sqlite:
    name: Node + SQLite API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Node + SQLite tests
        run: pnpm run test:node:ci
        env:
          BETTER_AUTH_SECRET: ${{ env.CI_TEST_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost
          POLAR_ACCESS_TOKEN: ${{ env.CI_TEST_POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ env.CI_TEST_POLAR_WEBHOOK_SECRET }}
          POLAR_PRO_PRODUCT_ID: ${{ env.CI_TEST_POLAR_PRO_PRODUCT_ID }}

      - name: Coverage job summary
        run: >-
          node scripts/write-coverage-summary.mjs
          --title "Node + SQLite API tests"

      - name: Upload coverage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-node
          path: packages/app/coverage/coverage-summary.json
          if-no-files-found: error

  coverage-pr-comment:
    name: PR coverage comment
    runs-on: ubuntu-latest
    needs: [quality, node-sqlite]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage-artifacts

      - name: Post or update sticky PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_WORKERS_SUMMARY: coverage-artifacts/coverage-workers/coverage-summary.json
          COVERAGE_NODE_SUMMARY: coverage-artifacts/coverage-node/coverage-summary.json
        run: node packages/app/scripts/coverage-pr-comment.mjs

  docker:
    name: Docker build and e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (migration harness only)
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: toggles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker e2e on internal network
        run: bash packages/app/scripts/docker-e2e-ci.sh
        env:
          CI_TEST_BETTER_AUTH_SECRET: ${{ env.CI_TEST_BETTER_AUTH_SECRET }}
          CI_TEST_POLAR_ACCESS_TOKEN: ${{ env.CI_TEST_POLAR_ACCESS_TOKEN }}
          CI_TEST_POLAR_WEBHOOK_SECRET: ${{ env.CI_TEST_POLAR_WEBHOOK_SECRET }}
          CI_TEST_POLAR_PRO_PRODUCT_ID: ${{ env.CI_TEST_POLAR_PRO_PRODUCT_ID }}
