name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_TEST_BETTER_AUTH_SECRET: ci-test-better-auth-secret
  CI_TEST_POLAR_ACCESS_TOKEN: ci-test-polar-access-token
  CI_TEST_POLAR_WEBHOOK_SECRET: ci-test-polar-webhook-secret
  CI_TEST_POLAR_PRO_PRODUCT_ID: ci-test-polar-pro-product-id

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Lint and format check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

  node-sqlite:
    name: Node + SQLite API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run Node + SQLite tests
        run: pnpm run test:node
        env:
          BETTER_AUTH_SECRET: ${{ env.CI_TEST_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost
          POLAR_ACCESS_TOKEN: ${{ env.CI_TEST_POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ env.CI_TEST_POLAR_WEBHOOK_SECRET }}
          POLAR_PRO_PRODUCT_ID: ${{ env.CI_TEST_POLAR_PRO_PRODUCT_ID }}

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: toggles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test self-host container
        run: |
          set -euo pipefail
          docker run -d --name toggles-ci-smoke \
            -p 127.0.0.1:3000:3000 \
            -e BETTER_AUTH_SECRET="${{ env.CI_TEST_BETTER_AUTH_SECRET }}" \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000/api/auth \
            -e DATABASE_URL=/tmp/toggles-ci.db \
            -e POLAR_ACCESS_TOKEN="${{ env.CI_TEST_POLAR_ACCESS_TOKEN }}" \
            -e POLAR_WEBHOOK_SECRET="${{ env.CI_TEST_POLAR_WEBHOOK_SECRET }}" \
            -e POLAR_PRO_PRODUCT_ID="${{ env.CI_TEST_POLAR_PRO_PRODUCT_ID }}" \
            -e LOCAL=true \
            -e PRODUCT_BETA=false \
            toggles:ci

          cleanup() {
            docker logs toggles-ci-smoke 2>&1 || true
            docker rm -f toggles-ci-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ping; then
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: /ping did not respond in time"
          exit 1
