<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      (function () {
        var s = localStorage.getItem("theme");
        var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (s === "dark" || (!s && d)) document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Toggles</title>
    <meta
      name="description"
      content="Toggles lets you manage feature flags across your projects. Enable or disable features at runtime — no redeployment needed."
    />

    <meta property="og:title" content="Toggles" />
    <meta
      property="og:description"
      content="Toggles lets you manage feature flags across your projects. Enable or disable features at runtime — no redeployment needed."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toggles.tinytown.studio/" />
    <meta property="og:image" content="https://toggles.tinytown.studio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Toggles — Ship features on your terms." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toggles" />
    <meta
      name="twitter:description"
      content="Toggles lets you manage feature flags across your projects. Enable or disable features at runtime — no redeployment needed."
    />
    <meta name="twitter:image" content="https://toggles.tinytown.studio/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <script prerender type="module" src="/src/index.tsx"></script>
  </body>
</html>
